<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Moradnati Games</title>
<meta name="description" content="Page not found.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#0f1714; --panel:#16211c; --line:#2a3a32; --ink:#e9efe6; --muted:#9fb0a5; --accent:#e8b04a;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif; color-scheme:dark; }
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); line-height:1.5; }
a { color:var(--accent); }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.wrap { max-width:980px; margin:0 auto; padding:0 20px; }
header { border-bottom:1px solid var(--line); background:linear-gradient(180deg,#13201a,var(--bg)); padding:40px 0 30px; }
.crumb { color:var(--muted); font-size:14px; margin-bottom:10px; }
.crumb a { color:var(--muted); }
h1 { font-family:var(--display); font-size:clamp(34px,5vw,56px); line-height:1.02; margin:0 0 10px; letter-spacing:-.01em; text-wrap:balance; }
h1 span { color:var(--accent); }
.lede { color:var(--muted); max-width:60ch; margin:0; font-size:18px; }
main { padding:30px 0 60px; }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:18px; }
.card { display:grid; grid-template-rows:200px auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; text-decoration:none; color:var(--ink); }
.card:hover { border-color:var(--accent); }
.card .pic { background:radial-gradient(circle at 50% 60%,#22352b,#101a15); display:grid; place-items:center; }
.card .pic img { max-height:180px; max-width:90%; }
.card .txt { padding:16px 18px 18px; }
.card h2 { font-family:var(--display); font-size:24px; margin:0 0 4px; }
.card p { margin:0; color:var(--muted); }
.card .go { display:inline-block; margin-top:10px; color:var(--accent); font-weight:700; }
.soon { opacity:.55; pointer-events:none; }
footer { border-top:1px solid var(--line); color:var(--muted); font-size:14px; padding:18px 0 30px; }
</style>
</head>
<body>
<header><div class="wrap"><h1>Page <span>not found</span></h1><p class="lede"><a href="/">Back to Moradnati Games</a></p></div></header><footer><div class="wrap">Made by Netanel and Ariel · <a href="https://moradnati.com">moradnati.com</a></div></footer>
</body>
</html>
